name: Gerar APK - Minha Estante

on:
  workflow_dispatch:
  push:
    paths:
      - 'Minha_Estante_Organizador_V4_117.html'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar ferramentas Android
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          yes | sdkmanager --licenses || true

      - name: Criar projeto Capacitor
        run: |
          mkdir -p app/www

          cp "Minha_Estante_Organizador_V4_117.html" "app/www/index.html"

          cd app

          cat > package.json <<'EOF'
          {
            "name": "minha-estante",
            "version": "1.0.0",
            "private": true,
            "scripts": {
              "build": "echo Aplicação HTML pronta"
            }
          }
          EOF

          npm install @capacitor/core @capacitor/cli @capacitor/android

          cat > capacitor.config.json <<'EOF'
          {
            "appId": "br.com.minhaestante.app",
            "appName": "Minha Estante",
            "webDir": "www",
            "bundledWebRuntime": false
          }
          EOF

          npx cap add android

      - name: Preparar aplicativo Android
        working-directory: app
        run: |
          npx cap copy android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Minha-Estante-APK
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
